name: yggdrasil-api-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: yggdrasil_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: elestio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  test:
    build:
      context: .
      dockerfile: deploy/Dockerfile.test
    volumes:
      - ./test-results:/app/test-results
    # Issue #30: the object-storage contract tests in src/storage/client.test.ts
    # talk to this MinIO, so the service has to be started before them. No
    # healthcheck, deliberately: the MinIO image does not reliably ship an HTTP
    # client binary, so a shell-based check would either always pass or always
    # fail depending on the tag. The test polls `ensureBucket` instead — the same
    # operation it is about to exercise — which is a readiness probe that cannot
    # drift from what it is probing for.
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@postgres:5432/yggdrasil_test
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: test
      S3_FORCE_PATH_STYLE: "true"
    # Issue #30: the object-storage contract tests in
    # src/storage/client.test.ts talk to the MinIO service below, so it has to
    # be started before them. Deliberately `service_started` rather than a
    # healthcheck condition: the MinIO image does not reliably ship an HTTP
    # client binary, so a shell-based check would either always pass or always
    # fail depending on the tag. The test polls `ensureBucket` instead — the
    # same operation it is about to exercise — which is a readiness probe that
    # cannot drift from what it is probing for.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
